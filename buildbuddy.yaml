  - name: Chromium Linux runtime tests
    container_image: ubuntu-24.04
    allow_concurrent_runs: false
    allow_concurrent_runs_on_branches: []
    timeout: 6h
    resource_requests:
      cpu: 8
      memory: 32GB
      disk: 200GB
    triggers:
      push:
        branches: [main, "perf/compile-cross-platform"]
      pull_request:
        branches: ["*"]
        merge_with_base: false
    steps:
      - run: |
          elevate=()
          if [[ "$(id -u)" != 0 ]]; then elevate=(sudo); fi
          "${elevate[@]}" apt-get update
          "${elevate[@]}" apt-get install -y xvfb libasound2t64 libpulse0 libgbm1 libdbus-1-3 libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libatk1.0-0t64 libatk-bridge2.0-0t64
          bazel test --config=browser --config=buildbuddy --strategy=TestRunner=local --local_test_jobs=4 \
            //:components //:runtime_tests //tools/ci:network_portability_test \
            //tools/ci:graphics_portability_test @boringssl//:pki_test @nss//bazel:sign_test
          python3 tools/run_x11_integration.py -- --config=browser --config=buildbuddy --strategy=TestRunner=local

