        merge_with_base: false
    steps:
      - run: |
          registry="$(pwd)/compatibility_registry"
          cd compatibility_registry/tests
          bazel test --registry="file://$registry" --registry=https://bcr.bazel.build \
            //:libraries //:cpuinfo_consumer_test
          cd ../..
          python3 tools/check_compatibility_modules.py --work-dir "$(mktemp -d /tmp/compatibility-modules.XXXXXX)"

