    steps:
      - run: |
          python3 -m tools.ci.bb_cold \
            --native-tools --blink-pch --jobs 19 --binding-workers 4 --trained-compiler --revision "$(git rev-parse HEAD)" \
            --directory "$BUILDBUDDY_ARTIFACTS_DIRECTORY/linux-amd64"

