name: Chromium cold artifact smoke

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      revision:
        required: true
        type: string
      invocation_url:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chromium-cold-smoke-${{ inputs.platform }}-${{ inputs.revision }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.target.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: target
        env:
          TARGET_PLATFORM: ${{ inputs.platform }}
          SOURCE_REVISION: ${{ inputs.revision }}
          INVOCATION_URL: ${{ inputs.invocation_url }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from tools.ci.chromium import PLATFORMS
          from tools.ci.buildbuddy_artifacts import invocation_id
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE_REVISION']):
              raise ValueError('Expected full source commit SHA')
          if os.environ['TARGET_PLATFORM'] not in PLATFORMS:
              raise ValueError('Choose one supported platform')
          invocation_id(os.environ['INVOCATION_URL'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('runner=' + PLATFORMS[os.environ['TARGET_PLATFORM']]['smoke_runner'] + '\n')
          PY

  download:
    needs: platform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download verified cold artifact
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_RO_PUBLIC_KEY }}
          INVOCATION_URL: ${{ inputs.invocation_url }}
          BUILD_SHA: ${{ inputs.revision }}
          TARGET_PLATFORM: ${{ inputs.platform }}
          ARTIFACT_KIND: cold-browser
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/chromium-artifact
        run: python3 -m tools.ci.buildbuddy_artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: chromium-${{ inputs.platform }}-${{ inputs.revision }}
          path: ${{ runner.temp }}/chromium-artifact/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  smoke:
    needs: [platform, download]
    uses: ./.github/workflows/smoke.yml
    with:
      platform: ${{ inputs.platform }}
      runner: ${{ needs.platform.outputs.runner }}
      revision: ${{ inputs.revision }}

  publish_status:
    needs: [platform, download, smoke]
    if: always() && !cancelled() && needs.platform.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_SHA: ${{ inputs.revision }}
      TARGET_PLATFORM: ${{ inputs.platform }}
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Publish native cold smoke result
        run: |
          state=$(jq -r 'if all(.[]; .result == "success") then "success" else "failure" end' <<< "$RESULTS")
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$BUILD_SHA" \
            -f state="$state" -f context="Chromium cold smoke $TARGET_PLATFORM" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Native cold artifact smoke: $state"
